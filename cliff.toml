# git-cliff configuration — Keep a Changelog format.
#
# Commits following Conventional Commits are grouped (feat -> Added,
# fix -> Fixed, perf -> Performance, ...). Subjects that do not follow
# the convention are kept verbatim in "Other" so nothing is lost.
[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project is maintained with [git-cliff](https://git-cliff.org).
"""
body = """
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{%- for commit in commits %}
- {{ commit.message | upper_first | trim }}
{%- endfor %}

{%- endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Our history predates Conventional Commits ("Phase 10: online leaderboards…"),
# so parse every subject as plain text and let the regex parsers group it.
conventional_commits = false
filter_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  # Our older subjects predate the convention — match what they start with.
  { message = "^Fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^Phase|^Add|^Online|^Polish|^Autoplay|^Finished|^LeaderboardStore|^Server|^Client|^GameAuthority|^Scoreboard", group = "Added" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true }, # e.g. bot changelog regeneration
  { message = "^ci", group = "Other" },
  { message = "^test", group = "Testing" },
  { message = "^Merge ", skip = true }, # merge-commit subjects are noise
  { message = ".*", group = "Other" },
]

# No [git.remote.github]: the origin may be private, and offline generation
# must not depend on the GitHub API (PR links are skipped without it).
