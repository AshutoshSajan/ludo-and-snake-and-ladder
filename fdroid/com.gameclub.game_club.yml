Builds:
  - versionName: 1.3.0
    versionCode: 11
    commit: 8eb5d64cdb489913a8f440b1ff62d22a479bfba0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.2
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - extension
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub --split-per-abi --target-platform
        android-arm --build-number $$VERCODE$$ --android-project-arg=force-version-code-ignoring-abi=true

