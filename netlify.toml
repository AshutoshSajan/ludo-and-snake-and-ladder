# Netlify configuration for the Flutter web build.
#
# The web app is a static site: `flutter build web --release` emits
# build/web, published below. The Dart WebSocket game server
# (bin/server.dart) does NOT run on Netlify — serverless functions cannot
# hold long-lived WebSocket connections — so online multiplayer needs the
# server hosted separately (VPS/Railway/Fly). The lobby's server URL field
# accepts any ws://host:port/ws, so the deployed site can point at it.

[build]
  # Git-based deploys: install Flutter if the build image lacks it, then
  # build the web bundle. The _flutter clone is cached between builds.
  command = """
  if [ ! -x _flutter/bin/flutter ]; then
    git clone --depth 1 -b stable https://github.com/flutter/flutter.git _flutter
  fi
  export PATH="$PWD/_flutter/bin:$PATH"
  flutter config --no-analytics
  flutter build web --release
  """
  publish = "build/web"

# SPA fallback: deep links and refreshes resolve to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived asset caching for the build output (hashed filenames).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
