<!DOCTYPE html>
<!--
  The toolbar popup: the game itself, nothing in front of it.

  This used to be a launcher - a die, an "Open Game Club" button, a "Play
  online" button - and the launcher was the whole problem. The app's own home
  screen already offers local play, online play, and the leaderboards, so the
  launcher was asking the same question a second time, in plainer HTML, before
  handing over to the same UI. The popup now goes straight to the real main
  screen and gets out of the way.

  Plain HTML and a single iframe rather than a second Flutter build: there is
  no UI here to render, so there is nothing for CanvasKit to draw. The colours
  are copied from lib/ui/theme.dart so the surround still matches the app.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --felt: #123524;
        --felt-light: #1b4a33;
        --ivory: #f5efe0;
        --ivory-dark: #e5dcc3;
        --gold: #d9a441;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 800px;
        height: 600px;
        margin: 0;
        overflow: hidden;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ivory);
        background: radial-gradient(
          circle at 50% -20%, var(--felt-light) 0%, var(--felt) 70%
        );
      }
      /* The game fills the popup outright. There is no launcher, so there is
         nothing to reveal, which sidesteps the trap the launcher created: a
         display:none iframe has a 0x0 viewport, so Flutter measures itself at
         zero and renders nothing. Laid out and visible from the first paint
         means the game boots straight into a correctly sized frame. */
      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #123524;
      }
      /* The one thing that stays: the popup is capped at 800x600 and a 10-seat
         Snakes grid needs more room than that, so a way out to a real tab is
         still a click away. */
      #over {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 2;
        display: flex;
        gap: 6px;
      }
      #over button {
        font-family: inherit;
        font-size: 11px;
        color: var(--ivory);
        background: rgba(18, 53, 36, .82);
        border: 1px solid rgba(245, 239, 224, .3);
        border-radius: 7px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #over button:hover { background: rgba(27, 74, 51, .95); }
    </style>
  </head>
  <body>
    <!-- The game, filling the popup from the first paint. -->
    <iframe id="game" title="Game Club" src="index.html"></iframe>
    <!-- The one control that remains: out to a real tab, for when 800x600 is
         not enough room. -->
    <div id="over">
      <button id="tab" title="Open in a tab">&#x1F5D5; Tab</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
