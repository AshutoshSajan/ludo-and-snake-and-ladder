# Game Club — load balancer for N stateless game-server instances.
#
# Room-affinity routing: every replica holds its rooms in process memory,
# so all four players of a room must reach the SAME instance. `hash $arg_code
# consistent` pins a WebSocket whose URL carries ?code=XXXX (join by code,
# reconnect) to a stable replica; nginx ketama hashing keeps that mapping
# stable even when replicas are added or removed. The shipped client
# (lib/services/online_client.dart) appends ?code= to the WebSocket URL on
# joins and on every reconnect, so affinity engages for both; the room code
# still rides in the `hello` frame, which the server treats as authoritative.
#
# When the client cannot supply a code up front (room creation, quick match),
# the request hashes to "no code" and lands anywhere — that is fine, because
# the creating player stays wherever they landed. JOINERS however may need a
# different replica; for those, /rooms/lookup is the escape hatch:
#
#     GET /rooms/lookup?code=ABCD  ->  {"ok":true,"code":"ABCD",
#                                       "instance":"game-2"}
#
# A small sidecar (or nginx njs/lua) can call this endpoint on a failed WS
# join and proxy_pass to the returned instance. The room registry is backed
# by Turso (ROOM_TTL_SECONDS, default 120s) so crashed replicas leave no
# stale routes.
#
# Test locally:  nginx -c deploy/nginx.conf -p .
# then run two replicas:
#   INSTANCE_ID=game-1 dart run bin/server.dart --port 8081
#   INSTANCE_ID=game-2 dart run bin/server.dart --port 8082

worker_processes auto;
pid /tmp/game-club-nginx.pid;
error_log /tmp/game-club-nginx-error.log;

events { worker_connections 4096; }

http {
  access_log /tmp/game-club-nginx-access.log;

  upstream game_backend {
    # Room-affinity: same room code -> same replica, consistent across
    # replica churn. Connections without ?code= hash to the empty key and
    # are distributed normally.
    hash $arg_code consistent;

    server 127.0.0.1:8081;  # INSTANCE_ID=game-1
    server 127.0.0.1:8082;  # INSTANCE_ID=game-2
    # add more replicas here / via consul-template etc.
  }

  server {
    listen 8080;

    # WebSocket upgrade for the game transport.
    location /ws {
      proxy_pass http://game_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Long-lived idle sockets: a board game can sit quiet between turns.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Plain HTTP endpoints — sticky routing is harmless here, but any
    # replica can serve them (all share the Turso leaderboard).
    location / {
      proxy_pass http://game_backend;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
