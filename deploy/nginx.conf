# Game Club — load balancer for N stateless game-server instances.
#
# Room-affinity routing: every replica holds its rooms in process memory,
# so all four players of a room must reach the SAME instance. `hash $arg_code
# consistent` pins a WebSocket whose URL carries ?code=XXXX (join by code,
# reconnect) to a stable replica; nginx ketama hashing keeps that mapping
# stable even when replicas are added or removed. The shipped client
# (lib/services/online_client.dart) appends ?code= to the WebSocket URL on
# joins and on every reconnect; the room code still rides in the `hello`
# frame, which the server treats as authoritative.
#
# Hashing by code is NOT ownership, though: a room is created on whichever
# replica the code-less first connection landed on (creation and quick match
# hash the empty key and land anywhere). A later join or reconnect with
# ?code= can therefore hash to a replica that never saw the room. The
# reroute path fixes that: the wrongly-landed replica answers `hello` with
# an error frame carrying `owner: <instance>` (it asks /rooms/lookup's
# registry), and the client retries with ?owner=<instance> — the map below
# pins such requests to the owning replica directly, bypassing the hash
# slot. That makes the flow work for both reconnects and fresh joiners:
#
#     GET /rooms/lookup?code=ABCD  ->  {"ok":true,"code":"ABCD",
#                                       "instance":"game-2"}
#     hello on game-1, room unknown there -> error {.., "owner":"game-2"}
#     retry: wss://lb/ws?code=ABCD&owner=game-2  ->  proxied to game-2
#
# The registry is backed by Turso (ROOM_TTL_SECONDS, default 120s) so
# crashed replicas leave no stale routes. nginx OSS has no request-time
# upstream selection other than variable proxy_pass — the map keeps the
# override set closed (only instances listed here are reachable via
# ?owner=), so it cannot be abused as an open proxy. Adding a replica
# means updating BOTH the upstream block and the map.
#
# Test locally:  nginx -c deploy/nginx.conf -p .
# then run two replicas:
#   INSTANCE_ID=game-1 dart run bin/server.dart --port 8081
#   INSTANCE_ID=game-2 dart run bin/server.dart --port 8082

worker_processes auto;
pid /tmp/game-club-nginx.pid;
error_log /tmp/game-club-nginx-error.log;

events { worker_connections 4096; }

http {
  access_log /tmp/game-club-nginx-access.log;

  upstream game_backend {
    # Room-affinity: same room code -> same replica, consistent across
    # replica churn. Connections without ?code= hash to the empty key and
    # are distributed normally.
    hash $arg_code consistent;

    server 127.0.0.1:8081;  # INSTANCE_ID=game-1
    server 127.0.0.1:8082;  # INSTANCE_ID=game-2
    # add more replicas here / via consul-template etc.
  }

  # Reroute override: the client echoes the owning instance it learned
  # from the server's reroute error as ?owner=; only instances in this
  # map are reachable that way.
  map $arg_owner $ws_upstream {
    default  http://game_backend;
    game-1   http://127.0.0.1:8081;  # INSTANCE_ID=game-1
    game-2   http://127.0.0.1:8082;  # INSTANCE_ID=game-2
    # add more replicas here too (keep in sync with game_backend)
  }

  server {
    listen 8080;

    # WebSocket upgrade for the game transport.
    location /ws {
      proxy_pass $ws_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Long-lived idle sockets: a board game can sit quiet between turns.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Plain HTTP endpoints — sticky routing is harmless here, but any
    # replica can serve them (all share the Turso leaderboard).
    location / {
      proxy_pass http://game_backend;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
