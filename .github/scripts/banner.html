<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'FrauncesApp'; src: url('../../assets/fonts/fraunces/Fraunces-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'FrauncesApp'; src: url('../../assets/fonts/fraunces/Fraunces-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'FrauncesApp'; src: url('../../assets/fonts/fraunces/Fraunces-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'FrauncesApp'; src: url('../../assets/fonts/fraunces/Fraunces-Black.ttf'); font-weight: 900; }
  @font-face { font-family: 'ManropeApp'; src: url('../../assets/fonts/manrope/Manrope-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'ManropeApp'; src: url('../../assets/fonts/manrope/Manrope-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'ManropeApp'; src: url('../../assets/fonts/manrope/Manrope-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'ManropeApp'; src: url('../../assets/fonts/manrope/Manrope-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'ManropeApp'; src: url('../../assets/fonts/manrope/Manrope-ExtraBold.ttf'); font-weight: 800; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 400px; overflow: hidden; }

  body {
    position: relative;
    font-family: 'ManropeApp', sans-serif;
    background:
      radial-gradient(120% 140% at 50% -30%, rgba(201, 164, 92, 0.16), transparent 55%),
      radial-gradient(90% 90% at 50% 120%, rgba(33, 80, 58, 0.55), transparent 62%),
      linear-gradient(135deg, #07140E 0%, #0C1F17 52%, #173A2A 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1B2A21;
    overflow: hidden;
  }

  /* ---- decorative line art ---- */
  .deco { position: absolute; opacity: 0.10; pointer-events: none; }
  .ladder { left: -44px; top: -70px; transform: rotate(24deg); }
  .snake  { right: -34px; bottom: -76px; transform: rotate(-8deg); }

  /* ---- brass hairline frame ---- */
  .frame {
    position: absolute; inset: 14px;
    border: 1.5px solid rgba(201, 164, 92, 0.38);
    border-radius: 20px;
    pointer-events: none;
  }
  .frame::before, .frame::after {
    content: ''; position: absolute; width: 8px; height: 8px;
    background: #C9A45C; transform: rotate(45deg);
  }
  .frame::before { left: -5px; top: -5px; }
  .frame::after  { right: -5px; bottom: -5px; }

  /* ---- invitation card ---- */
  .card {
    position: relative;
    z-index: 2;
    width: 872px;
    min-height: 300px;
    padding: 52px 62px 30px;
    border-radius: 24px;
    background:
      repeating-linear-gradient(0deg, rgba(27, 42, 33, 0.022) 0 1px, transparent 1px 4px),
      linear-gradient(160deg, #FCF7EC 0%, #F6EEDD 58%, #EFE3CC 100%);
    border: 2px solid rgba(201, 164, 92, 0.8);
    box-shadow:
      0 26px 70px rgba(0, 0, 0, 0.42),
      0 3px 0 rgba(255, 255, 255, 0.35) inset,
      0 -18px 44px rgba(132, 89, 30, 0.08) inset;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* brass pin line just inside the card edge */
  .card::before {
    content: '';
    position: absolute; inset: 9px;
    border: 1px solid rgba(201, 164, 92, 0.34);
    border-radius: 17px;
    pointer-events: none;
  }

  /* ---- seal with the four-colour die ---- */
  .seal {
    position: absolute;
    top: -44px; left: 50%;
    transform: translateX(-50%);
    width: 88px; height: 88px;
    border-radius: 50%;
    background: #0C1F17;
    border: 2px solid #C9A45C;
    box-shadow:
      0 0 0 6px #F6EEDD,
      0 0 0 7px rgba(201, 164, 92, 0.55),
      0 12px 26px rgba(0, 0, 0, 0.35);
    display: grid;
    place-items: center;
  }
  .die {
    width: 44px; height: 44px; border-radius: 11px;
    background: linear-gradient(145deg, #FFFDF4, #EFE6CE);
    border: 2px solid #C9A45C;
    box-shadow: inset 0 -3px 7px rgba(0,0,0,0.10);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    padding: 9px;
    transform: rotate(-7deg);
  }
  .pip { border-radius: 50%; }
  .pip.r { background: #C94B4B; }
  .pip.b { background: #3C6FD8; }
  .pip.y { background: #E0AC32; }
  .pip.g { background: #2E9E5B; }

  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    color: #8A6A2F;
    font-size: 11px; font-weight: 800; letter-spacing: 4px;
    text-transform: uppercase;
  }
  .eyebrow .line { width: 34px; height: 1px; background: rgba(138, 106, 47, 0.55); }

  h1 {
    margin-top: 9px;
    font-family: 'FrauncesApp', Georgia, serif;
    font-weight: 900;
    font-size: 82px;
    line-height: 0.98;
    letter-spacing: -2.4px;
    color: #1B2A21;
  }

  .sub {
    margin-top: 10px;
    font-size: 17px;
    font-weight: 500;
    color: #4B5A4F;
    letter-spacing: 0.15px;
  }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin-top: 17px; color: #A98545;
  }
  .divider .line { width: 74px; height: 1px; background: linear-gradient(90deg, transparent, rgba(169, 133, 69, 0.75)); }
  .divider .line.rev { background: linear-gradient(90deg, rgba(169, 133, 69, 0.75), transparent); }
  .divider .dot { width: 6px; height: 6px; background: #A98545; transform: rotate(45deg); }

  .pills { display: flex; gap: 10px; margin-top: 17px; }
  .pill {
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.7px; text-transform: uppercase;
    color: #3F4E43;
    background: rgba(233, 221, 197, 0.55);
    border: 1px solid rgba(169, 133, 69, 0.45);
    border-radius: 999px;
    padding: 7px 15px;
  }

  .foot {
    margin-top: 15px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 2.3px;
    text-transform: uppercase; color: #8A6A2F;
    opacity: 0.8;
  }

  /* ---- ludo colour rule ---- */
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; display: flex; height: 8px; z-index: 3; }
  .stripe span { flex: 1; }
  .stripe .r { background: #B94747; }
  .stripe .g { background: #2E7D4F; }
  .stripe .y { background: #D8AE45; }
  .stripe .b { background: #3A62B8; }
</style>
</head>
<body>
  <!-- ladder watermark -->
  <svg class="deco ladder" width="360" height="520" viewBox="0 0 360 520" fill="none">
    <rect x="60"  y="-40" width="22" height="620" rx="11" fill="#C9A45C"/>
    <rect x="240" y="-40" width="22" height="620" rx="11" fill="#C9A45C"/>
    <g fill="#C9A45C">
      <rect x="60" y="10"   width="202" height="18" rx="9"/>
      <rect x="60" y="110"  width="202" height="18" rx="9"/>
      <rect x="60" y="210"  width="202" height="18" rx="9"/>
      <rect x="60" y="310"  width="202" height="18" rx="9"/>
      <rect x="60" y="410"  width="202" height="18" rx="9"/>
    </g>
  </svg>

  <!-- snake watermark -->
  <svg class="deco snake" width="560" height="420" viewBox="0 0 560 420" fill="none">
    <path d="M20 300 C 110 140, 210 400, 320 240 S 480 90, 545 170"
          stroke="#C9A45C" stroke-width="30" stroke-linecap="round"/>
    <circle cx="545" cy="170" r="26" fill="#C9A45C"/>
    <circle cx="555" cy="161" r="5" fill="#07140E"/>
  </svg>

  <div class="frame"></div>

  <div class="card">
    <div class="seal">
      <div class="die">
        <span class="pip r"></span><span class="pip b"></span>
        <span class="pip y"></span><span class="pip g"></span>
      </div>
    </div>

    <div class="eyebrow">
      <span class="line"></span>
      <span>The Green Room</span>
      <span class="line"></span>
    </div>

    <h1>Game Club</h1>

    <div class="sub">Ludo &amp; Snakes and Ladders, played around one table.</div>

    <div class="divider">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line rev"></span>
    </div>

    <div class="pills">
      <span class="pill">Online rooms</span>
      <span class="pill">Smart bots</span>
      <span class="pill">Leaderboards</span>
    </div>

    <div class="foot">Local · Online · Right in your browser</div>
  </div>

  <div class="stripe">
    <span class="r"></span><span class="g"></span><span class="y"></span><span class="b"></span>
  </div>
</body>
</html>
