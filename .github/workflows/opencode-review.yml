name: OpenCode review

# Advisory, read-only review for pull requests into the integration branch and
# the release branch. The model never approves, requests changes, or merges; a
# human owns the merge.
#
# Manual only: no pull-request event starts this workflow. A maintainer opens
# the Actions tab, runs "OpenCode review" with the PR number, and that explicit
# request is the only trigger — so model spend and key use happen only when a
# human decides a review is worth them. Drafts are reviewable on request; the
# PR must be open and its head must live in this repository.
#
# Dispatch it with the PR number:
#   gh workflow run opencode-review.yml --ref dev -f pr=<number>
# CLI dispatch works from any branch whose copy of this file declares
# workflow_dispatch (dev has it); GitHub lists the workflow in the Actions UI
# only once the file exists on the default branch.
#
# Two jobs deliberately:
#   * `review` only needs read-only repository scopes and never receives a
#     GitHub token in the model process.
#   * `publish` is the only job with `pull-requests: write` / `issues: write`,
#     and it runs trusted code from the BASE commit, never from the PR head.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

# A newer dispatch for the same PR supersedes the old run. The publisher
# re-checks the PR head before posting, so a run that was already downloading
# cannot attach a review to a commit that has moved on.
concurrency:
  group: opencode-review-${{ github.workflow }}-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The resolve step reads the PR object (base/head shas, state, head
      # repo). The token never reaches the model process: it runs under
      # `env -i` with only the provider key.
      pull-requests: read
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
      model: ${{ steps.gate.outputs.model }}
      pr: ${{ inputs.pr }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      # The dispatch input names the PR; this resolves and pins the two commits
      # the rest of the workflow uses — the base (trusted scripts, diff bottom)
      # and the head (checkout, diff top). A closed PR, a deleted branch, or a
      # fork head fails here, before any PR code is checked out.
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          # The workflow file itself must come from a trusted branch: a
          # dispatch selects the ref whose YAML runs, and this job carries the
          # provider key. PR code never supplies this file.
          if [ "$GITHUB_REF" != "refs/heads/dev" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch OpenCode review from dev or main, not from $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::inputs.pr must be a pull request number"
            exit 1
          fi
          data="$(gh api "repos/$REPO/pulls/$PR")"
          state="$(jq -r '.state' <<<"$data")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$data")"
          if [ "$state" != "open" ]; then
            echo "::error::PR #$PR is $state; only open pull requests are reviewed."
            exit 1
          fi
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::PR #$PR has head repository '$head_repo'; only same-repository branches are reviewed."
            exit 1
          fi
          echo "base_sha=$(jq -r '.base.sha' <<<"$data")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$data")" >> "$GITHUB_OUTPUT"

      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          # The diff is `base...head`; a shallow clone silently loses the merge
          # base. The model also needs to read nearby files, so a real checkout
          # is the point.
          fetch-depth: 0
          persist-credentials: false
          path: workspace

      - name: Check out trusted base scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          sparse-checkout: .github/opencode
          persist-credentials: false
          path: trusted

      - name: Check configuration
        id: gate
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          set -euo pipefail
          model="${OPENCODE_MODEL:-opencode/deepseek-v4.1-flash}"
          echo "model=$model" >> "$GITHUB_OUTPUT"

          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::notice::OPENCODE_API_KEY is not configured; skipping the OpenCode review."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The workflow starts on the PR that introduces it only after the
          # merge puts these files on the target branch. Until then a PR does
          # not fail: it gets a notice and no review.
          for file in \
            trusted/.github/opencode/reviewer-agent.json \
            trusted/.github/opencode/review-prompt.md \
            trusted/.github/opencode/prepare_review.py \
            trusted/.github/opencode/sanitize_checkout.py \
            trusted/.github/opencode/publish_review.py; do
            if [ ! -f "$file" ]; then
              echo "::notice::The base commit does not contain $file yet; skipping. Reviews start once this change is on the target branch."
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Prepare review context
        if: steps.gate.outputs.configured == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 trusted/.github/opencode/prepare_review.py \
            --workspace workspace \
            --output-dir "$RUNNER_TEMP/artifact" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --repo "$REPO"

      # Pinned release + sha256, the same mold as the osv-scanner and git-cliff
      # installs. The tarball is the platform binary, not an npm install: CI
      # needs one executable, not a node_modules tree.
      # The model process carries its provider key (only) as an environment
      # variable, which its tools' child processes inherit. Its grep follows
      # checkout symlinks after the lexical-path authorization, so a PR
      # could commit one link into /proc/self/environ and read the key back
      # through a permitted search (CWE-61). The boundary has to hold on
      # canonical targets: before anything runs here, trusted code removes
      # every symlink whose final target leaves the workspace — nothing
      # outside it is read or written in the process, and in-workspace
      # links (including dangling ones) are kept.
      - name: Reject checkout symlinks that leave the workspace
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python3 trusted/.github/opencode/sanitize_checkout.py --workspace workspace

      - name: Install OpenCode (pinned)
        if: steps.gate.outputs.configured == 'true'
        env:
          OPENCODE_VERSION: 2.1.2
          OPENCODE_SHA256: 2e1c665f5e82e531732329f2a3106672873477506e378b17d30eeabd31d139b3
        run: |
          set -euo pipefail
          url="https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-${OPENCODE_VERSION}.tgz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/opencode.tgz"
          echo "${OPENCODE_SHA256}  $RUNNER_TEMP/opencode.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tgz" -C "$RUNNER_TEMP/opencode-bin"
          install -m 0755 "$RUNNER_TEMP/opencode-bin/package/bin/opencode" \
            "$RUNNER_TEMP/opencode-bin/opencode"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/opencode-bin/opencode" --version

      - name: Run OpenCode
        if: steps.gate.outputs.configured == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: ${{ steps.gate.outputs.model }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
          CONFIG: ${{ github.workspace }}/trusted/.github/opencode/reviewer-agent.json
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR" "$RUNNER_TEMP/opencode-home"
          prompt="Review the attached pull request context. Return only the contracted <opencode_review> JSON block."

          # env -i: the model process gets no GITHUB_TOKEN, no Actions metadata,
          # and no repository secrets other than its own provider key. The
          # trusted config disables project config, so a PR cannot add an
          # opencode.json or .opencode/agent that widens these permissions.
          set +e
          env -i \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/opencode-home" \
            CI=true \
            OPENCODE_API_KEY="$OPENCODE_API_KEY" \
            OPENCODE_CONFIG="$CONFIG" \
            OPENCODE_DISABLE_PROJECT_CONFIG=1 \
            OPENCODE_DISABLE_AUTOUPDATE=1 \
            OPENCODE_DISABLE_TELEMETRY=1 \
            opencode run --standalone --agent reviewer -m "$MODEL" \
              --file "$ARTIFACT_DIR/context.md" "$prompt" \
              > "$ARTIFACT_DIR/review-output.txt" \
              2> "$ARTIFACT_DIR/review-stderr.txt"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::OpenCode exited with status $status; the publisher will post a parse-failure notice instead of a review."
            head -c 4000 "$ARTIFACT_DIR/review-stderr.txt" >&2 || true
          fi
          # The publisher owns the public error message. A model failure is not
          # a repository failure, so this job stays green and the artifact is
          # uploaded for the next job.
          exit 0

      - name: Upload review artifact
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: opencode-review
          path: ${{ runner.temp }}/artifact
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: review
    if: always() && needs.review.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Base commit, not PR head: a pull request must not be able to rewrite
      # the code that decides which comments are posted.
      - name: Check out trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.review.outputs.base_sha }}
          sparse-checkout: .github/opencode
          persist-credentials: false
          path: trusted

      - name: Download review artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: opencode-review
          path: artifact

      - name: Publish review
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.pr }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          MODEL: ${{ needs.review.outputs.model }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 trusted/.github/opencode/publish_review.py \
            --artifact-dir artifact \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --model "$MODEL" \
            --repo "$REPO" \
            --run-url "$RUN_URL"

      - name: Note the missing artifact
        if: steps.download.outcome != 'success'
        run: |
          echo "::notice::The review artifact is missing; nothing was published."
