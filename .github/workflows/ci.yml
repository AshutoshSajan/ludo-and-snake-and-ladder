name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request: # every PR, regardless of target branch

jobs:
  guard-main:
    # Branch protection is unavailable (private repo, free plan), so enforce
    # the "no direct pushes to main" rule here: the head of main must always
    # be a merge commit (i.e. it arrived via a PR / maintainer merge).
    # Note: squash-merging PRs into main will fail this guard — use merge
    # commits for staging -> main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject direct pushes to main
        run: |
          parents=$(git rev-list --parents -n 1 "${{ github.sha }}" | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::Direct push to main is forbidden."
            echo "::error::Merge 'staging' into 'main' via a pull request (merge commit, not squash)."
            exit 1
          fi
          echo "main head is a merge commit — OK"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux audio deps (audioplayers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release

  changelog:
    # Maintain CHANGELOG.md via git-cliff. Runs on pushes to main only —
    # that's where release tags live, so the generated versioned sections
    # are authoritative there (on dev/staging the tag is not reachable and
    # regeneration would flip-flop the file). It never pushes to main: it
    # opens a pull request targeting staging instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so git-cliff sees every commit

      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/git-cliff-2.14.1/git-cliff /usr/local/bin/git-cliff
          git-cliff --version

      - name: Regenerate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md

      - name: Open PR with CHANGELOG.md if changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/changelog-update
          base: staging # never main
          title: "chore: update CHANGELOG.md"
          body: "Regenerated by the git-cliff CI job from the commit history."
          commit-message: "chore: update changelog"
          add-paths: CHANGELOG.md
          delete-branch: true
