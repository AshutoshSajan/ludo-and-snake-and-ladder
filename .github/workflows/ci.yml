name: CI

on:
  push:
    # main only. Runner minutes are metered and this repo
    # exhausted them before, so a run has to be worth it: main is where a
    # change ships.
    branches: [main]
    # Release tags are handled by release.yaml workflow
  pull_request:
    # Only PRs that target main. Without this filter the workflow runs for a PR
    # into dev too, which is the whole point of a cheap integration branch: the
    # full suite then bills twice for one commit (once for the PR into dev,
    # again for the PR that promotes it), and hosted runner minutes are metered
    # and were exhausted in this repo before.
    #
    # Four activity types, no more: with no types filter GitHub also runs on
    # labeled, assigned, converted_to_draft and the rest, so editing a PR's
    # metadata triggers a full suite. `closed` is deliberately NOT one of them:
    # a merge fires push-on-main, which already runs the full verify, so a
    # closed event would bill the same commit's suite a second time in
    # parallel — exactly the queue-pile this policy exists to prevent.
    # Branch cleanup after a merge is prune-branch.yml's job, not this
    # workflow's.
    branches: [main]
    types: [opened, synchronize, reopened]

# One live workflow per ref: a newer event replaces the queued one instead of
# stacking behind it on the shared runner pool. A PR and the push its merge
# produces carry different refs, so they do not fight each other; same-ref
# churn (a re-pushed tag, a rebased PR) is what this collapses.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-main:
    # Branch protection is unavailable (private repo, free plan), so enforce
    # the "no direct pushes to main" rule here: the head of main must always
    # be a merge commit (i.e. it arrived via a PR / maintainer merge).
    # Note: squash-merging PRs into main will fail this guard — use merge
    # commits.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject direct pushes to main
        run: |
          parents=$(git rev-list --parents -n 1 "${{ github.sha }}" | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::Direct push to main is forbidden."
            echo "::error::Open a pull request into 'main' and merge it (merge commit, not squash)."
            exit 1
          fi
          echo "main head is a merge commit — OK"

  test:
    # Pull requests into main only - the `on.pull_request.branches` filter is
    # what scopes that, not this `if`. The closed action is named out too: if
    # anyone reintroduces it in the types above, a closed event still must
    # not bill the whole suite behind a push to main that already ran it.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux audio deps (audioplayers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release

  release-prep:
    # CHANGELOG.md is generated, never hand-edited; the rules live in cliff.toml
    # and the generator is tool/changelog.sh, which is the same script the local
    # hook used to call. Generating it here rather than in the hook means the
    # file is produced once, in one place, and cannot be a bot commit racing a
    # human commit.
    #
    # main and tag pushes only VERIFY. Regenerating here would be wrong twice
    # over: main's head must stay a merge commit for guard-main, and a bot
    # commit pushed straight at it would fail that guard.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      # contents: push the bump branch. pull-requests: open it. Without the
      # second, `gh pr create` fails with "Resource not accessible by
      # integration (repository.pullRequests)" AFTER the branch is pushed,
      # leaving a stranded chore/release-prep-* branch with no PR — which is
      # exactly how this was found.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff resolves versioned sections from tags; a shallow clone
          # silently produces a changelog with the release history missing.
          fetch-depth: 0

      # The bump below opens a pull request, and `gh` is preinstalled on
      # GitHub-hosted runners — so this is only a guard, not the mechanism.
      # Without it the job fails at the last step with "gh: command not found",
      # after the version has already been bumped in the working tree and
      # committed, so the run looks like a toolchain problem instead of the
      # policy problem it is.
      - name: Check gh is available
        run: |
          if ! gh --version; then
            echo "::error::the GitHub CLI is missing from this runner image"
            exit 1
          fi

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/git-cliff.tar.gz
          echo "${GIT_CLIFF_SHA256}  /tmp/git-cliff.tar.gz" | sha256sum -c -
          # The archive's top directory is "git-cliff-<version>", not the
          # asset's platform triplet - naming the wrong one fails with
          # "Not found in archive", which says nothing about the real cause.
          tar -xzf /tmp/git-cliff.tar.gz -C /usr/local/bin --strip-components=1 \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          chmod +x /usr/local/bin/git-cliff
          git-cliff --version

      - name: Verify the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The tag is what users see and what AMO records. If the declared
          # version disagrees with it, the release notes, the store listing and
          # the uploaded package would all name different versions. Fail here,
          # before credentials are used.
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(tool/version.sh)
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $declared"
            echo "  fix: tool/version.sh --set $tagged && git commit -am 'chore: set version to $tagged'"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches the declared version"

      # "Regenerate and commit" used to live here, gated on staging/dev pushes.
      # Those branches no longer trigger the workflow, so the step could never
      # fire — it would have been a job that looked like it maintained the
      # release record and quietly did nothing.
      #
      # It is back, on main, and it commits THROUGH A PULL REQUEST rather than
      # pushing. That indirection is the whole trick: `guard-main` rejects any
      # main head that is not a merge commit, and a bot commit pushed straight at
      # main is not one — so the automated version has to arrive by merge, the
      # same way a person's does.
      #
      # The changelog is regenerated on every qualifying run. When a bump is
      # due, the version moves in the SAME commit: two commits could land in
      # either order, and a changelog describing 1.1.0 sitting next to a
      # pubspec claiming 1.2.0 is exactly the drift that made the declared
      # version untrustworthy in the first place. When main already declares
      # the next version (for example 1.3.0 merged before a v1.3.0 tag exists),
      # only the changelog is committed — the version still moves with it in
      # that run, never backwards.
      #
      # `chore:` matters: cliff.toml skips chore subjects, so this commit adds no
      # changelog entry of its own. Without that, the bot's commit would make the
      # changelog stale again the moment it landed and the verify step would fail
      # the very push that fixed it — a loop. That is exactly what happened when
      # the tag, rather than the PR, was the thing being committed to.
      #
      # It runs BEFORE the changelog verify, and deliberately so: that verify is
      # `--check`, so on a main push it would fail against the changelog the bot
      # has not written yet, every single time. Regenerating first and verifying
      # after makes the check a real assertion about what was just produced
      # instead of a race between two steps.
      - name: Regenerate the changelog and bump the version
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base=$(tool/version.sh)
          echo "declared version: $base"
          if ! git diff --quiet origin/main HEAD; then
            echo "::warning::main moved while this run started; skipping release preparation"
            exit 0
          fi
          next=$(tool/version.sh --bump)
          # `next` comes from the highest v* tag, while `base` is what main
          # declares. They can be equal before a release is tagged (main has
          # already merged a 1.3.0 bump, but the newest tag is still v1.2.1),
          # and `next` can be older than `base` when history lags the tag.
          # `next == base` is not "nothing to do": the changelog can still be
          # stale, and the old early exit here is exactly how main ended up
          # failing `changelog.sh --check` forever. Choose the target, then
          # always regenerate.
          target=$(tool/release_target.sh "$base" "$next")
          if [ "$target" = "$base" ]; then
            echo "declaring $base (no version bump); regenerating the changelog"
          else
            echo "next version: $target"
          fi
          # Always write, even when the version is unchanged. --set is
          # idempotent for an equal version (the Android build code is
          # preserved), and it repairs a declaration that lagged the rest —
          # exactly the case when a release-prep PR bumped pubspec but the
          # snap was still on the previous version. `build-snap` compares its
          # version with the tag and refuses to package a drift, so a
          # broken fourth declaration must be fixed here, before the tag.
          tool/version.sh --set "$target"
          tool/changelog.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "chore/release-prep-$target"
          git add CHANGELOG.md pubspec.yaml extension/manifest.chrome.json \
            extension/manifest.firefox.json snap/snapcraft.yaml
          if git diff --quiet --cached; then
            echo "nothing changed; not opening a PR"
            exit 0
          fi
          git commit -m "chore: release prep $target - regenerate changelog"
          git push -u origin "chore/release-prep-$target"

          # A PR, not a push, because guard-main forbids the alternative. Skipped
          # rather than left failing if one is already open for this version: two
          # would race, and the second push would be rejected anyway.
          if gh pr list --head "chore/release-prep-$target" --state open \
               --json number | grep -q number; then
            echo "a PR for $target is already open; leaving it alone"
            exit 0
          fi
          # The body is built with bash $'...' rather than a heredoc or a plain
          # double-quoted string: both need the text to span lines, and inside a
          # YAML block scalar an unindented continuation is parsed as a new key
          # - which silently corrupts the workflow file instead of failing loudly.
          # One line, \n escapes, no indentation to get wrong.
          body=$'Automated: regenerates `CHANGELOG.md` for the current history. The release version is '"$target"$'.\n\nOpened by the `release-prep` job. It commits through a PR because `guard-main` requires the head of main to be a merge commit, and a bot push is not one.\n\nMerge to apply. `verify-release` and `publish-firefox` run on the merge, not on this PR.'
          if ! gh pr create --base main --head "chore/release-prep-$target" \
               --title "chore: release prep $target" \
               --body "$body"; then
            echo "::warning::could not open the release-prep PR; the changelog stays stale"
          fi

      # After the regenerate, not before it. On a main push this asserts that what
      # the step above just produced is internally consistent; on a tag it is the
      # release record, and failing it is the point — stale release notes would
      # otherwise ship silently.
      - name: Verify the changelog matches history
        run: tool/changelog.sh --check

  # The `test` and `guard-main` jobs stay. They are the only real backstop —
  # a hook can be skipped with --no-verify and does not run on merges made from
  # the GitHub UI — so they are worth restoring the moment quota allows.
  #
  # Merged-branch pruning moved to its own workflow,
  # .github/workflows/prune-branch.yml — it covers PRs into `dev` as well as
  # `main`, which this file's pull_request trigger (scoped to `main` above)
  # could never do: widening that trigger here would bill every integration
  # PR for a full suite, exactly what the meteredRunnerMinutesAre comment
  # forbids.


  # ---------------------------------------------------------------------------
  # Store publishing
  #
  # Both jobs live here so the Chrome path is not lost while it is switched
  # off. Uncommenting the Chrome job is a one-step change; rediscovering the
  # whole thing is not.
  #
  # Both need credentials in repository secrets, which are NOT in the repo:
  #   AMO_API_KEY, AMO_API_SECRET            (addons.mozilla.org API credentials)
  #   CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
  #
  # They run on a tag so a release is a deliberate act rather than something
  # that happens whenever main moves.
  # ---------------------------------------------------------------------------

  verify-release:
    # The gate between a merge and a store upload. Runs on a main push as well as
    # on a tag, because publishing is driven by main now rather than by a tag.
    # `test` cannot serve here: it is pull-request-scoped, and a skipped job's
    # dependent never starts — which is what left publishing stuck.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux audio deps (audioplayers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  publish-firefox:
    # Builds the signed-package-ready .xpi and hands it to addons.mozilla.org,
    # which does the signing. AMO rejects an unsigned upload, so this is the
    # only route; there is no local equivalent worth automating.
    #
    # Driven by an ext-v* tag (extension release), not a main push.
    # This matches the Sudoku workflow pattern where extension releases
    # are driven by ext-v* tags.
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-24.04
    # Needs BOTH. `release-prep` performs the version bump and changelog
    # regeneration this upload has to reflect, and `verify-release` is the only
    # test gate on this path - `test` is pull-request-scoped, so on a push it is
    # skipped, and a job whose dependency was skipped never starts. That is what
    # left publishing stuck rather than running.
    #
    # NOTE: This job now runs on ext-v* tags (extension releases), not on main push.
    # The release-prep and verify-release jobs will run on the tag push as well
    # because the workflow triggers on tags via the main workflow.
    needs: [release-prep, verify-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Without this the job's very first command is `flutter pub get`, and a
      # GitHub runner has no Flutter on PATH: `flutter: command not found`,
      # exit 127, before any credential is touched. Both other jobs that build
      # (test, verify-release) install it here, and publish-firefox was the one
      # that did not - it is the only job whose failure was invisible, because
      # its trigger had never fired.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the web bundle
        # The extension bundles the whole Flutter payload; there is no dart-define
        # for the server here, so an add-on build needs no configuration.
        run: |
          flutter pub get
          flutter build web --release

      - name: Package the add-on
        run: ./tools/build_extension.sh --firefox --zip

      - name: Submit to addons.mozilla.org
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          # `sign`, not `publish`: web-ext has no `publish` subcommand. The
          # commands are build, sign, run, lint, docs, dump-config. Passing
          # `publish` fails on argument parsing before it ever reaches AMO, so
          # the job could not have worked however long it was left running.
          #
          # AMO does the signing; there is no unsigned upload route. `listed`
          # publishes to the public channel, `unlisted` self-signs only.
          #
          # --approval-timeout 0 disables the wait for AMO's automatic
          # approval. Without it `sign` blocks for the default 5 minutes on
          # every submission, which on a runner is five minutes of doing
          # nothing and then a timeout - the job hangs rather than finishing.
          # New add-ons are held for human review regardless, so waiting buys
          # nothing; the upload itself has already been accepted by then.
          npx --yes web-ext@10.7.0 sign \
            --source-dir build/extension-firefox \
            --channel listed \
            --amo-metadata extension/amo.metadata.json \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --approval-timeout 0

  # publish-chrome:
  #   COMMENTED OUT ON PURPOSE. The Chrome Web Store path needs a paid developer
  #   account ($5 one-off, then a 5% cut), which is not set up, and a publish
  #   job that fails on every tag is worse than no job. The build and upload
  #   steps are kept so enabling it is a review, not a rewrite.
  #
  #   To enable: uncomment, and add the three CHROME_* secrets.
  #
  # if: startsWith(github.ref, 'refs/tags/v')
  # runs-on: ubuntu-24.04
  # needs: [release-prep, verify-release]
  # permissions:
  #   contents: read
  # steps:
  #   - uses: actions/checkout@v7
  #   - run: flutter pub get
  #   - run: flutter build web --release
  #   - run: ./tools/build_extension.sh --chrome --zip
  #   - uses: actions/upload-artifact@v4
  #     with:
  #       name: game-club-chrome
  #       path: build/game-club-chrome.zip
  #   # Uploading to the Web Store needs the Chrome Web Store API via a
  #   # publisher service account; the credential names are in the README.
