name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    # Every PR, regardless of target branch. Limited to these four activity
    # types: with no types filter GitHub runs the workflow on *every*
    # pull_request activity (labeled, assigned, converted_to_draft, ...), which
    # means a full test run whenever someone edits a PR's metadata. 'closed' is
    # included because prune-branch acts once the PR merges.
    types: [opened, synchronize, reopened, closed]

jobs:
  guard-main:
    # Branch protection is unavailable (private repo, free plan), so enforce
    # the "no direct pushes to main" rule here: the head of main must always
    # be a merge commit (i.e. it arrived via a PR / maintainer merge).
    # Note: squash-merging PRs into main will fail this guard — use merge
    # commits for staging -> main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject direct pushes to main
        run: |
          parents=$(git rev-list --parents -n 1 "${{ github.sha }}" | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::Direct push to main is forbidden."
            echo "::error::Merge 'staging' into 'main' via a pull request (merge commit, not squash)."
            exit 1
          fi
          echo "main head is a merge commit — OK"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux audio deps (audioplayers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release

  changelog:
    # CHANGELOG.md is generated, never hand-written: git-cliff rebuilds the whole
    # file from commit history (rules in cliff.toml), so a PR that edits it by
    # hand gets overwritten on the next run anyway.
    #
    # Run it on the pull requests that *promote* code — anything whose base is
    # staging or main — and commit the result onto that PR's own head branch.
    # The changelog then travels with the code it describes and lands on main
    # inside the same merge commit, instead of showing up afterwards in a
    # separate bot PR that no one asked for.
    #
    # Why not on every PR: a feature branch can only see part of the unreleased
    # history, so regenerating there would write a shorter file that the next
    # promotion immediately rewrites. Restricted to staging/main, where head
    # already contains base in this repo's dev -> staging -> main flow, and the
    # "loses a release section" step below fails loudly instead of silently
    # shrinking the file if that assumption breaks.
    #
    # It can still never write to main directly: this job pushes only to a PR
    # head branch, and guard-main rejects any main head with a single parent.
    # Fork PRs are skipped (their head branch lives outside this repo, so the
    # token cannot push there); a maintainer can run the same generator locally.
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'staging' || github.base_ref == 'main') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the regenerated file onto the PR head branch
    concurrency:
      group: changelog-${{ github.event.pull_request.number }}
      cancel-in-progress: false # two pushes must not race for the same head branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }} # the branch under review, not the merge ref
          fetch-depth: 0 # full history + tags, so versioned sections resolve

      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/git-cliff-2.14.2/git-cliff /usr/local/bin/git-cliff
          git-cliff --version

      - name: Regenerate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md

      - name: Refuse a changelog that loses a release section
        run: |
          git show HEAD:CHANGELOG.md > "$RUNNER_TEMP/before.md" 2>/dev/null \
            || : > "$RUNNER_TEMP/before.md"
          missing=$(comm -23 \
            <(grep '^## ' "$RUNNER_TEMP/before.md" | sort) \
            <(grep '^## ' CHANGELOG.md | sort))
          if [ -n "$missing" ]; then
            echo "::error::Regenerated CHANGELOG.md would drop section(s): $(echo "$missing" | tr '\n' ',')"
            echo "::error::This head branch is missing commits the base branch has. Merge the base branch in, then push."
            exit 1
          fi

      - name: Commit and push onto the PR head branch
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already matches this history — nothing to commit."
            echo "CHANGELOG.md is up to date for this history." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Regenerated CHANGELOG.md:" | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --stat -- CHANGELOG.md | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog"
          # Note: a push authenticated as GITHUB_TOKEN does not start another
          # workflow run, so this commit carries no checks of its own. It touches
          # nothing but CHANGELOG.md, so the test job's verdict on the previous
          # head still stands.
          git push origin "HEAD:${{ github.head_ref }}"

  prune-branch:
    # Remove a merged PR's head branch so merged branches stop piling up. The
    # repo's own "delete branch on merge" setting is off and cannot simply be
    # turned on: it deletes the head branch of *every* merged PR, and this repo
    # promotes with dev -> staging -> main, so the next promotion would delete
    # dev, and the one after that staging.
    #
    # Runs on the "closed" event, for which GitHub reads the workflow file from
    # the base branch — so this job prunes only once it has landed on the trunk
    # a PR targets. Three guards: a trunk is never deleted, branch names outside
    # this repo's prefixes are never touched, and a branch holding commits that
    # did not reach the base is kept rather than discarded (that also catches a
    # force-push after review). Fork PRs are skipped: not our branch to delete.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # delete the merged branch
    concurrency:
      group: prune-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every branch tip is needed to prove the merge landed

      - name: Delete the merged head branch
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref }}"
          base="${{ github.base_ref }}"
          case "$branch" in
            main | staging | dev)
              echo "head branch '$branch' is a trunk — keeping it"
              exit 0
              ;;
          esac
          case "$branch" in
            feat/* | fix/* | chore/* | ci/* | docs/* | perf/* | refactor/* | test/* | release/*) ;;
            *)
              echo "'$branch' does not match a known prefix — leaving it alone"
              exit 0
              ;;
          esac
          if ! git merge-base --is-ancestor "origin/$branch" "origin/$base"; then
            echo "::warning::origin/$branch has commits that are not in origin/$base — not deleting"
            exit 0
          fi
          git push origin --delete "$branch"
          echo "deleted $branch (merged into $base)" | tee -a "$GITHUB_STEP_SUMMARY"
