name: Release

# One-tag binary releases: push `vX.Y.Z` on main (or dispatch manually
# for a dry run) and every distributable is built and attached to the
# GitHub Release. Extension tags (`ext-v*`) are NOT matched here.
#
# The tag is also the only path that republishes production hosting: once
# the GitHub Release is out, this file fires the Netlify and Render deploy
# hooks (deploy-hosting), so merging into main — and the dev->main promo —
# is no longer a web release. Neither platform's own Git integration
# deploys anymore: netlify.toml's ignore command skips every Git-triggered
# build and render.yaml turns autoDeploy off. Hosts rebuild from the branch
# tip of main, so cut the tag ON the main commit you intend to ship.
#
# Test runs can rebuild only the legs that failed before: dispatch with
# `legs: build-linux,build-appimage` (comma- or space-separated job names).
# A subset run leaves `publish` skipped — a `needs` leg that never runs
# skips its dependents — so a partial test can never publish anything.
# A tag push always runs every leg and is the only publish path.
#
# LUDO also ships a browser extension: this file builds the add-ons as
# Release artifacts (build-extension, installable zip/xpi for side-loaders)
# and submits the Firefox build to addons.mozilla.org (publish-amo) on the
# same tag. ci.yml once claimed that lane behind an ext-v* trigger — but
# ci.yml fires on main pushes and PRs only, so a tag could never reach it and
# the job was unreachable. This file adds the Sudoku-style binary artifacts
# (apk, deb, rpm, AppImage, Windows setup, web zip, snap) that ci.yml never
# produced.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z override (defaults to tag, else pubspec)'
        required: false
        default: ''
      legs:
        description: 'Job names to run for a test dispatch (e.g. build-linux,build-appimage). Empty or "all" = every leg. Never publishes.'
        required: false
        default: ''

permissions:
  contents: read

# Builds seven artifacts (phone, desktop, web, snap, appimage, extension);
# each build matrix leg is minutes of metered runner. A re-tagged or
# re-dispatched version replaces the run it supersedes instead of letting
# both build the whole artifact matrix at once.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-legs:
    # Decides whether a run is a full release matrix or a leg-filtered test.
    # A push (a v* tag — the only publish path) is always full. A dispatch
    # may name a comma- or space-separated subset of legs to rebuild only
    # what failed previously; unknown names abort with the valid list.
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.select.outputs.full }}
      legs: ${{ steps.select.outputs.legs }}
      build-android: ${{ steps.select.outputs.build-android }}
      build-linux: ${{ steps.select.outputs.build-linux }}
      build-appimage: ${{ steps.select.outputs.build-appimage }}
      build-windows: ${{ steps.select.outputs.build-windows }}
      build-web: ${{ steps.select.outputs.build-web }}
      build-extension: ${{ steps.select.outputs.build-extension }}
      build-snap: ${{ steps.select.outputs.build-snap }}
    steps:
      - id: select
        env:
          REQUESTED: ${{ inputs.legs }}
        run: |
          valid='build-android build-linux build-appimage build-windows build-web build-extension build-snap'
          if [ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ] \
            || [ -z "$REQUESTED" ] || [ "$REQUESTED" = 'all' ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'legs=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          legs=$(echo "$REQUESTED" | tr ',' ' ' | xargs)
          for leg in $legs; do
            case " $valid " in
              *" $leg "*) ;;
              *)
                echo "::error title=Unknown leg::'$leg' is not a build leg."
                echo 'Valid legs: build-android, build-linux, build-appimage,'
                echo 'build-windows, build-web, build-extension, build-snap'
                exit 1
                ;;
            esac
          done
          for token in $valid; do
            case " $legs " in
              *" $token "*) state=true ;;
              *) state=false ;;
            esac
            echo "$token=$state" >> "$GITHUB_OUTPUT"
          done
          echo 'full=false' >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "subset run: $legs"

  verify:
    needs: release-legs
    # analyze+tests are the tag-path quality gate; a leg-filtered test does
    # not repeat them (ci.yml runs them on every push already).
    if: needs.release-legs.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        # Inherited from ci.yml's release-prep, where the step guarded a tag
        # that workflow could never receive. `verify` is inside the tag run,
        # so the guard is live here: a tag that names X while the declared
        # version reads Y would otherwise ship release notes, a store listing
        # and uploaded packages naming different versions. Fail before
        # anything is built or published.
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(tool/version.sh)
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $declared"
            echo "  fix: tool/version.sh --set $tagged && git commit -am 'chore: set version to $tagged'"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches the declared version"
      - name: Install Linux audio deps (audioplayers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter analyze --fatal-infos
      - run: flutter test

  resolve-version:
    needs: release-legs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build-number: ${{ steps.ver.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - id: ver
        run: |
          python3 - <<'EOF'
          import os
          import re

          ref = os.environ.get('GITHUB_REF', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          override = os.environ.get(
              'INPUT_VERSION', os.environ.get('VERSION_INPUT', '')).strip()

          version = ''
          if ref.startswith('refs/tags/'):
              m = re.fullmatch(r'v(\d+\.\d+\.\d+)', ref_name)
              # ext-v* tags must never drive an app release.
              if not m:
                  raise SystemExit(
                      f"Tag {ref_name!r} is not a vX.Y.Z app release tag")
              version = m.group(1)
          if not version:
              version = override
          if not version:
              with open('pubspec.yaml') as f:
                  pub = f.read()
              version = re.search(
                  r'^version:\s*(\d+\.\d+\.\d+)',
                  pub, re.M).group(1)
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid version {version!r}')

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f"version={version}\n")
              f.write(f"build-number={os.environ['GITHUB_RUN_NUMBER']}\n")
          print(f'Releasing version {version}')
          EOF

  build-android:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-android == 'true'
    runs-on: ubuntu-24.04
    # The ANDROID_* secrets are promoted to job-level env rather than read in a
    # step `if:` — GitHub rejects `secrets` inside `if` outright ("Unrecognized
    # named-value: 'secrets'", actions/runner#520), so a guard written that way
    # fails workflow validation before any job runs. An unset secret becomes an
    # empty string, which `env.ANDROID_KEYSTORE_BASE64 != ''` tests cleanly.
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Without the ANDROID_* secrets the Gradle fallback signs release APKs
      # with the debug keystore — which does not exist on a fresh runner, so
      # validateSigningRelease fails after ~5 minutes of Gradle. Failing fast
      # here keeps the fix obvious (create the keystore, add the four secrets).
      - name: Require upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo '::error title=Android upload keystore missing::'
          echo 'Release APKs must be signed with a stable key or installed apps'
          echo 'cannot update across releases. Create the upload keystore once'
          echo '(keytool -genkeypair -v -keystore upload-keystore.jks'
          echo '  -keyalg RSA -keysize 2048 -validity 10000 -alias gameclub),'
          echo 'then add ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,'
          echo 'ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD as repository secrets.'
          exit 1
      # Signing: with the ANDROID_* secrets present the APKs are upload-signed.
      # Without them the guard above fails fast — release builds are never
      # debug-keyed from CI (a fresh runner has no debug keystore to fall back
      # to: runner-images allow-listed 'validateSigningRelease' crashed the
      # first tagged-build attempt, see v1.3.0 pipeline history).
      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - run: >
          flutter build apk --release --split-per-abi
          --build-name=$VERSION --build-number=$BUILD_NUMBER
      - run: >
          flutter build apk --release
          --build-name=$VERSION --build-number=$BUILD_NUMBER
      - run: >
          flutter build appbundle --release
          --build-name=$VERSION --build-number=$BUILD_NUMBER
      - run: |
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            dist/game-club-$VERSION-android-armv7.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/game-club-$VERSION-android-arm64.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
            dist/game-club-$VERSION-android-x86_64.apk
          mv build/app/outputs/flutter-apk/app-release.apk \
            dist/game-club-$VERSION-android-universal.apk
          mv build/app/outputs/bundle/release/app-release.aab \
            dist/game-club-$VERSION.aab
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: android-dist
          path: dist/

  build-linux:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-linux == 'true'
    # Oldest supported runner: glibc 2.35 baseline runs on Ubuntu 22.04
    # through the latest releases (forward-compatible), plus Debian 12+,
    # Fedora 36+ and RHEL 9+. A 24.04 build would not install on 22.04.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      # LUDO plays sounds through audioplayers, so the runner needs the same
      # GStreamer headers a laptop build needs — not just the GTK set.
      # -qq hid "held broken packages" detail from the runner image; verbose
      # output keeps runner-image drift in the logs instead of guesses.
      # actions/runner-images#9546: the 22.04 image ships LLVM's
      # libunwind-14-dev, which Breaks the GNU libunwind-dev that
      # libgstreamer1.0-dev needs. Remove the slotted LLVM variant first
      # (queried rather than named so image LLVM bumps keep it true); Flutter
      # builds against libstdc++ and never links LLVM's unwinder.
      - name: Install Linux build deps
        run: |
          slotted=$(dpkg --get-selections | awk '$1 ~ /^libunwind-1[0-9]/ && $2 == "install" {print $1}')
          if [ -n "$slotted" ]; then
            echo "removing LLVM slotted libunwind: $slotted"
            sudo apt-get remove -y $slotted
          fi
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build linux --release
          --build-name=$VERSION --build-number=$BUILD_NUMBER
      - name: Install nfpm (latest release)
        run: |
          tag=$(gh api repos/goreleaser/nfpm/releases/latest --jq .tag_name)
          curl -sSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/$tag/nfpm_${tag#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p dist
          sed "s/@VERSION@/$VERSION/g" packaging/nfpm.yaml.in > packaging/nfpm.yaml
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/
          tar -czf dist/game-club-$VERSION-linux-x64.tar.gz \
            -C build/linux/x64/release bundle
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: dist/

  build-appimage:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-appimage == 'true'
    # glibc floor: 24.04-built AppImages won't run on older distros.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      # LUDO plays sounds through audioplayers, so the runner needs the same
      # GStreamer headers a laptop build needs — not just the GTK set.
      # -qq hid "held broken packages" detail from the runner image; verbose
      # output keeps runner-image drift in the logs instead of guesses.
      # actions/runner-images#9546: the 22.04 image ships LLVM's
      # libunwind-14-dev, which Breaks the GNU libunwind-dev that
      # libgstreamer1.0-dev needs. Remove the slotted LLVM variant first
      # (queried rather than named so image LLVM bumps keep it true); Flutter
      # builds against libstdc++ and never links LLVM's unwinder.
      - name: Install Linux build deps
        run: |
          slotted=$(dpkg --get-selections | awk '$1 ~ /^libunwind-1[0-9]/ && $2 == "install" {print $1}')
          if [ -n "$slotted" ]; then
            echo "removing LLVM slotted libunwind: $slotted"
            sudo apt-get remove -y $slotted
          fi
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build linux --release
          --build-name=$VERSION --build-number=$BUILD_NUMBER
      - name: Fetch linuxdeploy + appimagetool
        run: |
          mkdir -p tools dist
          curl -sSL -o tools/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/linuxdeploy tools/appimagetool
      - run: |
          export PATH="$PWD/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Icon filename must match the desktop file's Icon= entry.
          cp web/icons/Icon-512.png packaging/game-club.png
          # Exec=game-club in the desktop file; the flutter bundle names the
          # binary game_club. linuxdeploy needs a file of the Exec name to
          # create the AppDir-root symlink, so stage the ubiquitarian copy.
          cp build/linux/x64/release/bundle/game_club \
             build/linux/x64/release/bundle/game-club
          # Stage 1: deploy the executable and its linked libraries.
          ./tools/linuxdeploy --appdir AppDir \
            -e build/linux/x64/release/bundle/game-club \
            -d packaging/game-club.desktop \
            -i packaging/game-club.png
          # Stage 2: the Flutter engine loads lib/libapp.so and data/
          # relative to the executable; linuxdeploy does not copy them.
          cp -r build/linux/x64/release/bundle/lib \
                build/linux/x64/release/bundle/data AppDir/usr/bin/
          test -f AppDir/usr/bin/lib/libapp.so
          test -d AppDir/usr/bin/data/flutter_assets
          # Stage 3: package the staged AppDir.
          ARCH=x86_64 ./tools/appimagetool AppDir dist/GameClub-$VERSION-x86_64.AppImage
          ./dist/GameClub-$VERSION-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-dist
          path: dist/

  build-windows:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-windows == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=$env:VERSION --build-number=$env:BUILD_NUMBER
      - run: mkdir dist
      - name: Portable zip
        run: >
          Compress-Archive
          -Path build\windows\x64\runner\Release\*
          -DestinationPath dist\game-club-$env:VERSION-windows-x64-portable.zip
      # No EV cert for v1: SmartScreen will warn. Portable zip is the
      # no-friction alternative; signing is a documented follow-up.
      - name: Inno Setup installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$env:VERSION `
            /Odist /Fgame-club-$env:VERSION-windows-x64-setup `
            packaging\inno\game-club.iss
          Get-ChildItem dist\
      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: dist/

  build-web:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-web == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: |
          mkdir -p dist
          cd build && zip -qr ../dist/game-club-$VERSION-web.zip web
          ls ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/

  build-extension:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-extension == 'true'
    # The add-ons as installable files, so the GitHub Release is complete
    # without touching AMO or the Web Store. The listing update on
    # addons.mozilla.org is publish-amo's job (needs a full run; submits the
    # freshly built source by rebuilding inside that job); this leg is the
    # downloadable copy a tester can side-load. Chrome loads the folder
    # unpacked; Firefox signs on upload, so the .xpi here is unsigned and
    # for testing only.
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: |
          mkdir -p dist
          ./tools/build_extension.sh --chrome --zip
          ./tools/build_extension.sh --firefox --zip
          cp build/game-club-chrome.zip dist/game-club-$VERSION-chrome.zip
          cp build/game-club-firefox.xpi dist/game-club-$VERSION-firefox-unsigned.xpi
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: dist/

  build-snap:
    needs: [release-legs, resolve-version]
    if: >-
      needs.release-legs.outputs.full == 'true' ||
      needs.release-legs.outputs.build-snap == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: ''
      - name: Fail on snapcraft.yaml version drift
        run: |
          snap_ver=$(grep -Po "^version:\s*'\K[^']+" snap/snapcraft.yaml)
          test "$snap_ver" = "$VERSION" || {
            echo "snap/snapcraft.yaml ($snap_ver) != tag ($VERSION)."
            echo "Bump snap version before tagging."
            exit 1
          }
      - uses: snapcore/action-build@v1
        id: build
      - run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.snap }}" dist/
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: snap-dist
          path: dist/

  publish:
    needs:
      - resolve-version
      - build-android
      - build-linux
      - build-appimage
      - build-windows
      - build-web
      - build-extension
      - build-snap
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-dist'
          path: dist
          merge-multiple: true
      - run: |
          ls -R dist
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
      # Manual dispatches validate the full pipeline without cutting
      # a public release; only real v* tags publish.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Game Club ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*

  deploy-hosting:
    # The release moment, continued: after the GitHub Release exists, the
    # web client (Netlify) and the game server (Render) follow it.
    #
    # Deploy hooks instead of Git integration, because a tag is not a
    # branch: Netlify and Render build the *branch* they are pointed at
    # (main), and NEITHER Platform offers "deploy when a tag lands" as a
    # trigger. The release cuts the tag on the main tip, so a hook — which
    # rebuilds main's tip — deploys the tagged commit.
    #
    # Dispatches must not re-point production hosting: a tag-shaped `if`
    # guards the job directly. `needs: publish` cannot do this alone — on
    # a FULL dispatch (legs empty or "all") publish runs and succeeds, so
    # needs alone would fire the hooks on a test run too.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [resolve-version, publish]
    runs-on: ubuntu-24.04
    # Job-level env rather than step `if` checks: GitHub rejects `secrets`
    # inside step `if` outright ("Unrecognized named-value: 'secrets'",
    # actions/runner#520) — same rationale as the ANDROID_* env above. An
    # unset secret becomes an empty string, which the guard below tests.
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      NETLIFY_DEPLOY_HOOK_URL: ${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Require both deploy hooks
        # Both-or-none: the POSTs below are not transactional, and a run
        # that updated one host and died before the other would leave
        # clients talking to a server at a different version. Fail before
        # anything is posted so re-running the job after adding the
        # missing secret deploys both hosts in one pass.
        if: env.NETLIFY_DEPLOY_HOOK_URL == '' || env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo '::error title=Deploy hooks missing::set both secrets on the repo (Settings > Secrets and variables > Actions).'
          echo '::error::NETLIFY_DEPLOY_HOOK_URL — Site settings > Build & deploy > Build hooks > Add build hook (name it "v* release", scope Production).'
          echo '::error::RENDER_DEPLOY_HOOK_URL — the service that runs the game server > Settings > Deploy hook > Add.'
          env | grep -E 'NETLIFY_DEPLOY_HOOK_URL|RENDER_DEPLOY_HOOK_URL' | cut -d= -f1 \
            | while read -r hook; do echo "::error::$hook is unset."; done
          exit 1
      - name: Deploy web client (Netlify)
        # The hook asks Netlify to start its Production deploy of `main`;
        # it does not carry an artifact, so GAME_SERVER_URL keeps coming
        # from that site's own environment configuration (see netlify.toml).
        # A 200 means the build is queued, not finished — netlify.toml's
        # command does the real verification of the site it ships.
        run: |
          echo "Netlify: deploying $VERSION (main @ $GITHUB_SHA)"
          curl -fsS --max-time 60 -X POST -d '{}' "$NETLIFY_DEPLOY_HOOK_URL" > /dev/null
          echo 'Netlify build queued (hook accepted).'
      - name: Deploy game server (Render)
        run: |
          echo "Render: deploying $VERSION (main @ $GITHUB_SHA)"
          curl -fsS --max-time 60 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo 'Render deploy queued (hook accepted).'

  publish-amo:
    # The release moment for the Firefox channel: after the GitHub Release
    # exists and the quality gate passes, submit the extension build to
    # addons.mozilla.org, which signs it. AMO takes a source upload through
    # its own API — not a GitHub Release, hence a real job instead of
    # another artifact beside build-extension's side-load xpi.
    #
    # needs publish, so the Release is out before the store learns of the
    # version, and needs verify, because a store upload is the most public,
    # least-revocable channel this repo ships to. (Hosting above follows the
    # tag regardless of verify; a store listing must not.)
    #
    # Typed by hand: dispatch runs and secret-absence must not touch the
    # listing, so the tag guards the job like deploy-hosting, and the
    # credentials guard every step inside it. Job-level env rather than a
    # step `if` on `secrets`: GitHub rejects `secrets` in an `if` outright
    # ("Unrecognized named-value: 'secrets'", actions/runner#520 — same
    # rationale as deploy-hosting's env above). An unset secret arrives as
    # an empty string, which the guard below distinguishes: both missing =
    # a loud skip (the Release is correct without the listing update, and a
    # fresh tag that fails the whole run would hide its artifacts behind a
    # red store job), exactly one = hard fail (a half-configured run would
    # otherwise build for minutes and fail mid-npx).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, resolve-version, publish]
    runs-on: ubuntu-24.04
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - name: Check the AMO credentials
        id: creds
        run: |
          if [ -z "$AMO_API_KEY" ] && [ -z "$AMO_API_SECRET" ]; then
            echo '::warning title=AMO publish skipped::AMO_API_KEY/AMO_API_SECRET are unset — the tag ships its GitHub Release artifacts without updating the addons.mozilla.org listing. Set BOTH repo secrets to publish the add-on from a tag.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo '::error title=AMO secrets half-configured::Exactly one of AMO_API_KEY / AMO_API_SECRET is set. Set both repo secrets — or leave both unset to always skip — and re-run.'
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          channel: stable
          cache: true
      - name: Build the web bundle
        if: steps.creds.outputs.ready == 'true'
        # The extension bundles the whole Flutter payload; there is no dart-define
        # for the server here, so an add-on build needs no configuration.
        run: |
          flutter pub get
          flutter build web --release
      - name: Package the add-on
        if: steps.creds.outputs.ready == 'true'
        run: ./tools/build_extension.sh --firefox --zip
      - name: Submit to addons.mozilla.org
        if: steps.creds.outputs.ready == 'true'
        run: |
          # `sign`, not `publish`: web-ext has no `publish` subcommand. The
          # commands are build, sign, run, lint, docs, dump-config. Passing
          # `publish` fails on argument parsing before it ever reaches AMO, so
          # the job could not have worked however long it was left running.
          #
          # AMO does the signing; there is no unsigned upload route. `listed`
          # publishes to the public channel, `unlisted` self-signs only.
          #
          # --approval-timeout 0 disables the wait for AMO's automatic
          # approval. Without it `sign` blocks for the default 5 minutes on
          # every submission, which on a runner is five minutes of doing
          # nothing and then a timeout - the job hangs rather than finishing.
          # New add-ons are held for human review regardless, so waiting buys
          # nothing; the upload itself has already been accepted by then.
          npx --yes web-ext@10.7.0 sign \
            --source-dir build/extension-firefox \
            --channel listed \
            --amo-metadata extension/amo.metadata.json \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --approval-timeout 0

